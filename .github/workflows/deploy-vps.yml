name: Déploiement sur le VPS

# Met le site en ligne sur aventuretime.antoinequarroz.ch à chaque push sur main.
# Ne fait rien tant que les secrets VPS_HOST, VPS_USER et VPS_SSH_KEY ne sont pas
# ajoutés (Settings > Secrets and variables > Actions). Voir deploy/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
    steps:
      - name: Vérifier la configuration
        id: check
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Secrets VPS absents : déploiement ignoré."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clé SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n' > ~/.ssh/config
      - name: Construire et envoyer
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: DEPLOY_PORT="${VPS_PORT:-22}" DEPLOY_PATH="${VPS_PATH:-/var/www/aventuretime}" ./deploy/deploy.sh
