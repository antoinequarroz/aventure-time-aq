# Site : aventuretime.antoinequarroz.ch
# À copier dans /etc/nginx/sites-available/aventuretime, puis activer (voir deploy/README.md).
# Certbot (`certbot --nginx`) ajoute lui-même le bloc HTTPS et la redirection HTTP -> HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name aventuretime.antoinequarroz.ch;

    root /var/www/aventuretime;
    index index.html;

    # Compression : le JS, le CSS et les modèles 3D (.glb) se compressent bien.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary model/gltf+json;

    # Brotli : à décommenter seulement si le module est installé
    # (Debian/Ubuntu : apt install libnginx-mod-http-brotli-filter).
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary;

    # Fichiers générés par Vite : leur nom change à chaque version, cache d'un an.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Modèles 3D : type MIME (absent de la liste par défaut de nginx) et cache d'une semaine.
    location ~* \.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Images des projets.
    location ~* \.(png|jpe?g|webp|svg)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Classement mondial : petit serveur Node (server/leaderboard.mjs, service aventuretime-scores).
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4k;
        add_header Cache-Control "no-store";
    }

    # La page elle-même : toujours revalidée, pour voir tout de suite la dernière version.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
